<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Monsters</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #unity-canvas {
        width: 100vw;
        height: 100dvh;
        max-width: calc(100dvh * 9 / 16);
        max-height: calc(100vw * 16 / 9);
        background: #000;
        display: block;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-warning {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        z-index: 10;
      }

      #portrait-warning {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #000;
        color: #fff;
        font-family: sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }

      #portrait-warning .box {
        border: 2px solid #fff;
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 420px;
      }

      #portrait-warning .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      #portrait-warning .text {
        font-size: 16px;
        line-height: 1.6;
      }

      @media screen and (orientation: landscape) and (max-width: 1024px) {
        #portrait-warning {
          display: flex;
        }

        #unity-container {
          visibility: hidden;
        }
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="900" height="1600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>

    <div id="portrait-warning">
      <div class="box">
        <div class="title">縦画面で遊んでください</div>
        <div class="text">
          端末を縦向きにすると、ゲーム画面が表示されます。<br>
          Please rotate your device to portrait mode.
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function resizeCanvasForPortrait() {
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        var targetRatio = 9 / 16;
        var currentRatio = viewportWidth / viewportHeight;

        if (currentRatio > targetRatio) {
          canvas.style.height = viewportHeight + "px";
          canvas.style.width = (viewportHeight * targetRatio) + "px";
        } else {
          canvas.style.width = viewportWidth + "px";
          canvas.style.height = (viewportWidth / targetRatio) + "px";
        }
      }

      window.addEventListener("resize", resizeCanvasForPortrait);
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeCanvasForPortrait, 300);
      });
      resizeCanvasForPortrait();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/1.0.loader.js";
      var config = {
        dataUrl: buildUrl + "/1.0.data.unityweb",
        frameworkUrl: buildUrl + "/1.0.framework.js.unityweb",
        codeUrl: buildUrl + "/1.0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Monsters",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          resizeCanvasForPortrait();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
